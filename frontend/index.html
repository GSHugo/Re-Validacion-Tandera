<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#173f35"><title>Tandera · Revalidación</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header><div><small>TANDERA</small><h1>Revalidación</h1></div><button id="adminBtn" class="ghost">Tarimas</button></header>
  <main>
    <section id="home" class="view active">
      <div class="hero"><p>Operación de montacarguista</p><h2>Revalida mercancía sin vueltas.</h2></div>
      <label>Operador<input id="operator" autocomplete="name" placeholder="Nombre o número"></label>
      <button id="newBtn" class="primary big">＋ Crear nueva tarima</button>
      <button id="continueBtn" class="secondary hidden">Continuar tarima abierta</button>
    </section>

    <section id="scan" class="view">
      <div class="status"><span id="palletId">—</span><b><span id="total">0</span> bultos</b></div>
      <div id="cameraBox" class="camera hidden"><video id="video" playsinline muted></video><div class="scanline"></div></div>
      <button id="cameraBtn" class="secondary">📷 Activar cámara</button>
      <form id="scanForm"><label>Código<input id="code" inputmode="text" autocomplete="off" autocapitalize="characters" placeholder="Ej. LA-BLUSA" required></label><button class="primary big">Guardar escaneo</button></form>
      <p id="lastScan" class="feedback"></p>
      <div class="card"><h3>Concentrado</h3><div id="summary" class="summary"></div></div>
      <button id="finishBtn" class="danger">Finalizar y ubicar tarima</button>
    </section>

    <section id="location" class="view">
      <button class="back" data-back="scan">← Volver a escaneos</button><h2>Asignar ubicación</h2>
      <p class="muted">La tarima se cerrará al confirmar.</p>
      <div class="grid3"><label>Pasillo<select id="aisle"></select></label><label>Posición<select id="position"></select></label><label>Nivel<select id="level"></select></label></div>
      <div class="locationPreview"><b id="shortLocation">S/36/N4</b><span id="fullLocation">TEX 1/TANDERA/S/36/N4</span></div>
      <button id="closeBtn" class="primary big">Confirmar ubicación y cerrar</button>
    </section>

    <section id="admin" class="view">
      <button class="back" data-back="home">← Inicio</button><div class="row"><h2>Tarimas registradas</h2><button id="exportBtn" class="ghost">Exportar Odoo</button></div>
      <input id="search" type="search" placeholder="Buscar tarima, ubicación o estado"><div id="palletList" class="list"></div>
    </section>

    <section id="detail" class="view"><button class="back" data-back="admin">← Tarimas</button><div id="detailBody"></div></section>
  </main>
  <div id="toast" role="status"></div><div id="loading" class="loading hidden">Procesando…</div>
  <script src="config.js"></script><script src="app.js"></script>
</body></html>
